<div class="map-address-search">
    <label for="map-address">Поиск адреса</label>
    <input id="map-address" type="search" placeholder="Например, Москва, улица Тверская" autocomplete="off" aria-controls="map-address-results" aria-describedby="map-address-status">
    <p id="map-address-status" role="status"></p>
    <div id="map-address-results" class="map-address-results" aria-label="Результаты поиска адреса"></div>
    <p>При нажатии браузер запросит доступ к местоположению; точка будет проверена через DaData.</p>
    <button class="button map-geolocate" type="button" id="detect-location">Определить моё местоположение</button>
    <p id="geolocation-status" role="status"></p>
    <p>На карте круг показывает примерную точность, сообщённую браузером.</p>
</div>
